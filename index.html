<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saad's Trading Cockpit</title>
<noscript><meta http-equiv="refresh" content="0; url=https://f54020e1722155.lhr.life/home"></noscript>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;margin:0}
main{text-align:center;padding:2rem;max-width:30rem}
.spinner{width:2.6rem;height:2.6rem;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;margin:0 auto 1.2rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.35rem;font-weight:600;margin:0 0 .5rem}
p{line-height:1.5}
.small{color:#94a3b8;font-size:.9rem}
a{color:#38bdf8}
button{background:#0ea5e9;border:0;color:#fff;font-size:1rem;font-weight:600;padding:.65rem 1.5rem;border-radius:.55rem;cursor:pointer;margin:.6rem 0}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
<div class="spinner" role="status" aria-label="Loading"></div>
<h1 id="headline">Connecting to your cockpit…</h1>
<p id="detail" class="small">Finding the fastest route — this usually takes a few seconds.</p>
<p><button id="retry" type="button">Try again now</button></p>
<p class="small">If this keeps spinning, you can <a id="direct" href="https://f54020e1722155.lhr.life/home">open the cockpit directly</a>.</p>
</main>
<script>
(function(){
var LANDING="https://f54020e1722155.lhr.life/home";
var headline=document.getElementById('headline');
var detail=document.getElementById('detail');
var direct=document.getElementById('direct');
var retry=document.getElementById('retry');
var timer=null;
function say(h,d){headline.textContent=h;detail.textContent=d;}
function load(){
  say('Connecting to your cockpit…','Finding the fastest route — this usually takes a few seconds.');
  fetch('status.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok){throw new Error('status '+r.status);}return r.json();})
    .catch(function(){say('Refreshing the link…','The latest link could not be loaded yet. Retrying automatically.');throw 'nostatus';})
    .then(function(s){
      var target=(s&&s.url)?s.url:LANDING;
      direct.href=target;
      var base=target.slice(-5)==='/home'?target.slice(0,-5):target;
      say('Checking the live link…','Making sure the cockpit is reachable before opening it.');
      // Probe the cockpit's real landing page and require a cockpit identity
      // marker ('TV-Exec' shell or Night Desk 'bottomnav') so a wrong-content
      // tunnel mapping can never redirect Saad.
      return fetch(base+'/',{mode:'cors',cache:'no-store'})
        .then(function(r){if(!r.ok){throw new Error('home '+r.status);}return r.text();})
        .then(function(t){if(t.indexOf('TV-Exec')<0&&t.indexOf('bottomnav')<0){throw new Error('wrong content');}return target;});
    })
    .then(function(target){
      say('Connected.','Opening your cockpit now.');
      window.location.replace(target);
    })
    .catch(function(e){
      if(e!=='nostatus'){say('Still connecting…','The cockpit link is being refreshed. Retrying automatically.');}
    });
}
retry.addEventListener('click',function(){if(timer){clearInterval(timer);}load();timer=setInterval(load,4000);});
load();
timer=setInterval(load,4000);
})();
</script>
</body>
</html>
